<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONOPOLY ONLINE</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Titan+One&family=Barlow+Condensed:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --ink:#0f0f0f; --gold:#c9a13a; --gold2:#f0d060; --board-bg:#c8dbb0;
  --cell-bg:#f2efe0; --cell-border:#8a8a7a; --panel-bg:#1a1a2e;
  --panel2:#16213e; --panel3:#0f3460; --accent:#e94560; --green:#2ecc71;
  --red:#e74c3c; --blue:#3498db; --white:#f8f5ee; --shadow:rgba(0,0,0,0.4); --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow Condensed',sans-serif;background:var(--panel-bg);
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(233,69,96,0.15),transparent),
  repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(255,255,255,0.01) 40px,rgba(255,255,255,0.01) 80px);
  min-height:100vh;color:var(--white);overflow-x:hidden;}

/* ── LOBBY ── */
#lobby{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px;}
.lobby-hero{text-align:center;margin-bottom:40px;}
.lobby-hero h1{font-family:'Titan One',cursive;font-size:clamp(52px,10vw,110px);color:var(--gold);line-height:0.9;
  text-shadow:4px 4px 0 rgba(0,0,0,0.5),0 0 60px rgba(201,161,58,0.4);letter-spacing:2px;animation:heroGlow 3s ease-in-out infinite;}
@keyframes heroGlow{0%,100%{text-shadow:4px 4px 0 rgba(0,0,0,0.5),0 0 40px rgba(201,161,58,0.3)}
  50%{text-shadow:4px 4px 0 rgba(0,0,0,0.5),0 0 80px rgba(201,161,58,0.7),0 0 120px rgba(240,208,96,0.3)}}
.lobby-hero .tagline{font-size:16px;letter-spacing:8px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-top:8px;}
.lobby-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:860px;width:100%;}
.lobby-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px;
  flex:1;min-width:280px;max-width:380px;backdrop-filter:blur(20px);position:relative;overflow:hidden;}
.lobby-card::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,161,58,0.08) 0%,transparent 60%);pointer-events:none;}
.lobby-card h2{font-family:'Titan One',cursive;font-size:22px;color:var(--gold);margin-bottom:20px;letter-spacing:1px;}
.field-label{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:6px;}
.field-input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:10px;
  color:white;font-family:'Barlow Condensed',sans-serif;font-size:18px;padding:12px 16px;outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;margin-bottom:16px;}
.field-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,161,58,0.15);}
.token-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.tok{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05);font-size:22px;cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;}
.tok:hover{border-color:var(--gold);transform:scale(1.1);}
.tok.sel{border-color:var(--gold);background:rgba(201,161,58,0.2);transform:scale(1.12);box-shadow:0 0 12px rgba(201,161,58,0.4);}
.num-row{display:flex;gap:8px;margin-bottom:20px;}
.num-btn{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05);color:white;font-family:'Barlow Condensed';font-size:20px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.num-btn:hover,.num-btn.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold);}
.btn-lobby{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Titan One',cursive;
  font-size:20px;letter-spacing:1px;cursor:pointer;transition:all 0.2s;margin-top:4px;}
.btn-create{background:linear-gradient(135deg,var(--gold),#a07020);color:#1a1a1a;box-shadow:0 4px 20px rgba(201,161,58,0.3);}
.btn-create:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,161,58,0.5);}
.btn-join{background:linear-gradient(135deg,var(--accent),#a02030);color:white;box-shadow:0 4px 20px rgba(233,69,96,0.3);}
.btn-join:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(233,69,96,0.5);}
.room-code-display{background:rgba(201,161,58,0.1);border:2px dashed rgba(201,161,58,0.4);
  border-radius:12px;text-align:center;padding:16px;margin-bottom:16px;}
.room-code-display .code-val{font-family:'Titan One',cursive;font-size:38px;color:var(--gold);letter-spacing:8px;}
.room-code-display .code-sub{font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:2px;margin-top:4px;}
.players-waiting{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.waiting-player{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);
  border-radius:8px;padding:10px 14px;animation:fadeSlide 0.3s ease;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.waiting-player .wp-tok{font-size:22px;} .waiting-player .wp-name{font-size:16px;font-weight:600;flex:1;}
.waiting-player .wp-you{font-size:11px;color:var(--gold);letter-spacing:2px;}
.status-msg{font-size:13px;color:rgba(255,255,255,0.5);text-align:center;margin-bottom:12px;letter-spacing:1px;}

/* ── GAME ── */
#game{display:none;width:100%;min-height:100vh;padding:12px;gap:12px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
#game.on{display:flex;}
#board-wrap{position:relative;flex-shrink:0;}
#board{display:grid;grid-template-columns:76px repeat(9,1fr) 76px;grid-template-rows:76px repeat(9,1fr) 76px;
  border:3px solid var(--ink);background:var(--board-bg);
  box-shadow:0 0 0 5px #fff,0 0 0 8px var(--ink),0 12px 60px rgba(0,0,0,0.6);
  border-radius:4px;width:min(660px,96vw);height:min(660px,96vw);}
.cell{border:1px solid #999;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  position:relative;overflow:hidden;background:var(--cell-bg);cursor:pointer;transition:filter 0.15s;padding:2px 1px;user-select:none;}
.cell:hover{filter:brightness(0.88);}
.cbar{position:absolute;top:0;left:0;right:0;height:11px;}
.cname{font-family:'Barlow Condensed',sans-serif;font-size:clamp(4.5px,0.78vw,7.5px);font-weight:700;
  line-height:1.15;text-align:center;text-transform:uppercase;color:var(--ink);letter-spacing:0.1px;}
.cprice{font-family:'Lora',serif;font-size:clamp(4px,0.65vw,6.5px);color:#444;}
.cicon{font-size:clamp(10px,1.7vw,18px);line-height:1;}
.cell.corner{background:#ddeedd;align-items:center;justify-content:center;}
.corner-lbl{font-family:'Barlow Condensed';font-size:clamp(6px,0.9vw,10px);font-weight:700;text-align:center;line-height:1.2;color:var(--ink);white-space:pre-line;}
.board-center{grid-column:2/11;grid-row:2/11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(ellipse at center,#e8f5d8 0%,#c8dbb0 100%);border:1px solid #999;}
.board-title{font-family:'Titan One',cursive;font-size:clamp(22px,4vw,46px);color:#1a3a6b;text-shadow:2px 2px 0 rgba(0,0,0,0.15);line-height:1;}
.board-sub{font-size:clamp(7px,1vw,12px);letter-spacing:5px;color:#666;text-transform:uppercase;}
.dice-area{display:flex;gap:12px;align-items:center;}
.die3d{width:clamp(34px,5vw,52px);height:clamp(34px,5vw,52px);perspective:200px;}
.die3d-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);border-radius:10px;}
.die3d.rolling .die3d-inner{animation:dieRoll 0.6s cubic-bezier(0.4,0,0.2,1);}
@keyframes dieRoll{
  0%{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg);}
  20%{transform:rotateX(180deg) rotateY(90deg) rotateZ(45deg);}
  40%{transform:rotateX(90deg) rotateY(270deg) rotateZ(180deg);}
  60%{transform:rotateX(270deg) rotateY(180deg) rotateZ(90deg);}
  80%{transform:rotateX(360deg) rotateY(360deg) rotateZ(270deg);}
  100%{transform:rotateX(360deg) rotateY(360deg) rotateZ(360deg);}
}
.die-face{width:100%;height:100%;background:white;border:2px solid #1a1a1a;border-radius:10px;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%;
  box-shadow:inset 0 0 8px rgba(0,0,0,0.1),2px 3px 0 rgba(0,0,0,0.2);}
.dot{display:flex;align-items:center;justify-content:center;}
.dot::after{content:'';width:55%;height:55%;border-radius:50%;background:#1a1a1a;display:none;box-shadow:0 1px 2px rgba(0,0,0,0.3);}
.dot.on::after{display:block;}
#tok-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.ptoken{position:absolute;width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;font-size:13px;z-index:10;pointer-events:none;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  transition:left 0.35s cubic-bezier(0.34,1.4,0.64,1),top 0.35s cubic-bezier(0.34,1.4,0.64,1),opacity 0.3s;will-change:left,top;}
.ptoken.active-glow{box-shadow:0 0 0 3px gold,0 0 12px rgba(255,215,0,0.6);}
.ptoken.moving{transition:left 0.18s ease-in-out,top 0.18s ease-in-out;z-index:20;}

/* ── SIDE PANEL ── */
#side{width:300px;min-width:260px;max-width:340px;flex:1;display:flex;flex-direction:column;gap:10px;}
.pcard{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius);padding:14px 16px;backdrop-filter:blur(10px);}
.pcard h3{font-family:'Titan One',cursive;font-size:16px;color:var(--gold);margin-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,0.07);padding-bottom:8px;letter-spacing:1px;}
.pl-row{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;
  border:1.5px solid transparent;transition:all 0.25s;margin-bottom:5px;position:relative;}
.pl-row.myturn{border-color:var(--gold);background:rgba(201,161,58,0.08);box-shadow:0 0 16px rgba(201,161,58,0.15);}
.pl-row.bankrupt{opacity:0.35;}
.pl-ava{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;border:2px solid rgba(255,255,255,0.15);flex-shrink:0;}
.pl-info{flex:1;min-width:0;}
.pl-name{font-size:15px;font-weight:700;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-bal{font-family:'Lora',serif;font-size:17px;color:var(--green);font-weight:600;}
.pl-bal.low{color:var(--red);}
.pl-sq{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.5px;}
.pl-turn-arrow{font-size:18px;animation:arrowBounce 0.5s ease infinite alternate;}
@keyframes arrowBounce{from{transform:translateX(0)}to{transform:translateX(5px)}}
.jail-tag{font-size:9px;background:var(--red);color:white;border-radius:3px;padding:1px 4px;margin-left:4px;letter-spacing:0.5px;}
.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.btn{border:none;border-radius:8px;font-family:'Barlow Condensed';font-size:15px;font-weight:700;
  letter-spacing:0.5px;padding:9px 12px;cursor:pointer;transition:all 0.15s;text-transform:uppercase;}
.btn:disabled{opacity:0.3;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
.btn-p{background:linear-gradient(135deg,#1a5fa8,#2d82d4);color:white;box-shadow:0 3px 12px rgba(26,95,168,0.4);}
.btn-p:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,95,168,0.5);}
.btn-g{background:linear-gradient(135deg,#1d8a4a,#27ae60);color:white;box-shadow:0 3px 12px rgba(39,174,96,0.4);}
.btn-g:hover:not(:disabled){transform:translateY(-2px);}
.btn-r{background:linear-gradient(135deg,#a02020,#e74c3c);color:white;}
.btn-r:hover:not(:disabled){transform:translateY(-2px);}
.btn-y{background:linear-gradient(135deg,#a07a00,#d4ac0d);color:#1a1a1a;}
.btn-y:hover:not(:disabled){transform:translateY(-2px);}
.btn-v{background:linear-gradient(135deg,#5a2080,#8e44ad);color:white;}
.btn-v:hover:not(:disabled){transform:translateY(-2px);}
.btn-o{background:linear-gradient(135deg,#a04a00,#e67e22);color:white;}
.btn-o:hover:not(:disabled){transform:translateY(-2px);}
.btn-sm{font-size:12px;padding:6px 10px;}
#turn-info{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px;font-family:'Lora',serif;font-style:italic;}
#not-your-turn{background:rgba(233,69,96,0.1);border:1px solid rgba(233,69,96,0.2);border-radius:8px;
  padding:8px 12px;font-size:13px;color:rgba(255,255,255,0.6);text-align:center;margin-bottom:8px;display:none;}
#props-area{display:flex;flex-wrap:wrap;gap:3px;max-height:90px;overflow-y:auto;}
.pchip{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);border-radius:4px;font-size:9px;padding:2px 5px;font-family:'Barlow Condensed';}
.pchip .cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
#log{max-height:150px;overflow-y:auto;font-family:'Lora',serif;font-size:12px;color:rgba(255,255,255,0.6);line-height:1.5;}
#log::-webkit-scrollbar{width:3px;}
#log::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px;}
.le{padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.le:last-child{border-bottom:none;}
.le.imp{color:var(--gold);font-weight:600;}
.le.good{color:#58d68d;}
.le.bad{color:#ec7063;}

/* ── MODAL ── */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:500;padding:16px;}
#modal-bg.on{display:flex;}
.modal{background:linear-gradient(160deg,#1e1e38,#151528);border:1px solid rgba(201,161,58,0.3);
  border-radius:20px;padding:28px 32px;max-width:440px;width:100%;
  box-shadow:0 24px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.05);
  animation:mIn 0.25s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes mIn{from{transform:scale(0.85) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal h2{font-family:'Titan One',cursive;font-size:24px;color:var(--gold);margin-bottom:12px;}
.modal p{font-family:'Lora',serif;font-size:14px;color:rgba(255,255,255,0.75);line-height:1.6;margin-bottom:6px;}
.modal-acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.modal-acts .btn{flex:1;min-width:90px;}
.color-bar-m{height:18px;border-radius:6px;margin-bottom:12px;}
.rent-t{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
.rent-t td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);}
.rent-t td:last-child{text-align:right;color:var(--gold);font-weight:700;}

/* ── TOASTS ── */
#toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:999;pointer-events:none;}
.toast{background:rgba(20,20,40,0.95);border:1px solid rgba(255,255,255,0.1);color:white;
  font-family:'Barlow Condensed';font-size:14px;letter-spacing:0.3px;padding:12px 18px;
  border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,0.4);
  animation:tIn 0.3s ease,tOut 0.3s ease 2.7s forwards;max-width:280px;border-left:4px solid var(--gold);}
.toast.good{border-left-color:var(--green);} .toast.bad{border-left-color:var(--red);}
@keyframes tIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes tOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(30px)}}

/* ── WIN ── */
#win{position:fixed;inset:0;background:linear-gradient(135deg,#0d1f3c,#1a3a6b);display:none;
  flex-direction:column;align-items:center;justify-content:center;z-index:2000;gap:16px;}
#win.on{display:flex;}
.win-emoji{font-size:80px;animation:spinPop 1.5s ease infinite alternate;}
@keyframes spinPop{from{transform:scale(1) rotate(-5deg)}to{transform:scale(1.1) rotate(5deg)}}
#win h1{font-family:'Titan One',cursive;font-size:clamp(48px,10vw,100px);color:var(--gold);text-align:center;animation:heroGlow 2s infinite;}
#win p{font-family:'Barlow Condensed';font-size:24px;color:white;letter-spacing:4px;}

/* ── TRADE ── */
.trade-sel{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);color:white;font-family:'Barlow Condensed';font-size:15px;margin-bottom:10px;}
.trow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.trow label{font-size:12px;color:rgba(255,255,255,0.5);min-width:50px;letter-spacing:1px;text-transform:uppercase;}
.trow input[type=number]{width:80px;padding:6px;border:1px solid rgba(255,255,255,0.15);border-radius:6px;
  background:rgba(255,255,255,0.08);color:white;font-family:'Barlow Condensed';font-size:15px;}
.tcl{max-height:90px;overflow-y:auto;font-size:12px;}
.tcheck{display:flex;align-items:center;gap:6px;padding:3px 0;color:rgba(255,255,255,0.8);cursor:pointer;}
.tcols{display:flex;gap:12px;}
.tcol{flex:1;}
.tcol-hd{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}

@media(max-width:780px){
  #game{flex-direction:column;align-items:center;}
  #side{width:100%;max-width:660px;}
}
</style>
</head>
<body>

<div id="lobby">
  <div class="lobby-hero">
    <h1>MONOPOLY</h1>
    <div class="tagline">Online Multiplayer</div>
  </div>
  <div class="lobby-cards">
    <div class="lobby-card" id="cfg-card">
      <h2>🎩 Your Identity</h2>
      <div class="field-label">Your Name</div>
      <input class="field-input" id="my-name" placeholder="Enter your name" maxlength="18" value="Player">
      <div class="field-label">Choose Token</div>
      <div class="token-grid" id="token-grid"></div>
    </div>
    <div class="lobby-card" id="join-card">
      <div id="pre-room">
        <h2>🎮 Play</h2>
        <div class="field-label">Max Players (Create)</div>
        <div class="num-row" id="num-row">
          <button class="num-btn" onclick="setMax(2)">2</button>
          <button class="num-btn on" onclick="setMax(3)">3</button>
          <button class="num-btn" onclick="setMax(4)">4</button>
          <button class="num-btn" onclick="setMax(5)">5</button>
          <button class="num-btn" onclick="setMax(6)">6</button>
        </div>
        <button class="btn-lobby btn-create" onclick="createRoom()">✨ Create Room</button>
        <div style="text-align:center;margin:14px 0;color:rgba(255,255,255,0.3);font-size:13px;letter-spacing:2px">— OR —</div>
        <div class="field-label">Room Code</div>
        <input class="field-input" id="room-code-in" placeholder="Enter 4-letter code" maxlength="4"
          style="text-transform:uppercase;letter-spacing:6px;font-size:22px;text-align:center">
        <button class="btn-lobby btn-join" onclick="joinRoom()">🚀 Join Room</button>
      </div>
      <div id="in-room" style="display:none">
        <h2>🏠 Room</h2>
        <div class="room-code-display">
          <div class="code-val" id="room-code-show">----</div>
          <div class="code-sub">Share this code with friends</div>
        </div>
        <div class="status-msg" id="room-status">Waiting for players…</div>
        <div class="players-waiting" id="waiting-list"></div>
        <button class="btn-lobby btn-create" id="start-game-btn" onclick="hostStartGame()" style="display:none">🎲 Start Game!</button>

function initFirebase(){

  try {
    let app;
    if(firebase.apps.length > 0) app = firebase.apps[0];
    else app = firebase.initializeApp(FIREBASE_CONFIG);

    return true;
  } catch(e){
    toast('Firebase error: ' + e.message, 'bad');
    return false;
  }
}

function renderTokenGrid(){
  const g = document.getElementById('token-grid');
  g.innerHTML = TOKENS.map((t,i) =>
    `<button class="tok${i===myTokenIdx?' sel':''}" onclick="pickTok(${i})">${t}</button>`
  ).join('');
}
function pickTok(i){ myTokenIdx=i; renderTokenGrid(); }
function setMax(n){
  maxPlayers=n;
  document.querySelectorAll('.num-btn').forEach((b,i)=>b.classList.toggle('on',i===n-2));
}
function rndCode(){ return Math.random().toString(36).substr(2,4).toUpperCase(); }

async function createRoom(){
  if(!initFirebase()) return;
  const name = (document.getElementById('my-name').value||'Player').trim();
  roomCode = rndCode(); 
  isHost = true; 
  myId = 0;
  
  const initState = {
    status:'lobby', maxPlayers, hostId:0,
    players:[{id:0,name,token:myTokenIdx,color:TCOLORS[myTokenIdx],
      money:1500,pos:0,inJail:false,jailTurns:0,jailCard:false,bankrupt:false,online:true}],
    props:[],
    current:0, rolled:false, diceVals:[1,1], doubles:0,
    chanceIdx:0, communityIdx:0, freeParking:0,
    pendingBuy:null,
  };
  
  SQUARES.forEach((sq,idx)=>{
    if(['property','railroad','utility'].includes(sq.type))
      initState.props.push({sqIdx:idx,owner:null,mortgaged:false,houses:0,hotel:false});
  });
  
  dbRef = fb.ref('rooms/'+roomCode);
  try {
    await dbRef.set(initState);
    document.getElementById('room-code-show').textContent = roomCode;
    document.getElementById('pre-room').style.display = 'none';
    document.getElementById('in-room').style.display = '';
    listenRoom();
  } catch(e){
    toast('Error creating room: ' + e.message, 'bad');
  }
}

async function joinRoom(){
  if(!initFirebase()) return;
  const code = (document.getElementById('room-code-in').value||'').toUpperCase().trim();
  if(code.length!==4){ toast('Enter a 4-letter room code','bad'); return; }
  const name = (document.getElementById('my-name').value||'Player').trim();
  
  dbRef = fb.ref('rooms/'+code);
  try {
    const snap = await dbRef.once('value');
    if(!snap.exists()){ toast('Room not found!','bad'); return; }
    
    const data = snap.val();
    if(data.status!=='lobby'){ toast('Game already started!','bad'); return; }
    
    const players = Array.isArray(data.players) ? data.players : Object.values(data.players || {});
    if(players.length >= data.maxPlayers){ toast('Room is full!','bad'); return; }
    
    const usedToks = players.map(p=>p.token);
    let tok = myTokenIdx;
    while(usedToks.includes(tok)) tok=(tok+1)%TOKENS.length;
    
    myTokenIdx = tok; 
    myId = players.length; 
    isHost = false; 
    roomCode = code;
    
    const newPlayer = {id:myId,name,token:myTokenIdx,color:TCOLORS[myTokenIdx],
      money:1500,pos:0,inJail:false,jailTurns:0,jailCard:false,bankrupt:false,online:true};
    
    await dbRef.child('players/'+myId).set(newPlayer);
    document.getElementById('room-code-show').textContent = roomCode;
    document.getElementById('pre-room').style.display = 'none';
    document.getElementById('in-room').style.display = '';
    listenRoom();
  } catch(e){
    toast('Error joining room: ' + e.message, 'bad');
  }
}

function listenRoom(){
  dbRef.on('value', snap=>{
    try {
      if(!snap.exists()) return;
      const data = snap.val();
      if(data.status==='playing' && document.getElementById('lobby').style.display!=='none'){
        G = data; 
        startGameUI(); 
        return;
      }
      if(data.status==='lobby'){
        const players = Array.isArray(data.players) ? data.players : Object.values(data.players || {});
        const wl = document.getElementById('waiting-list');
        wl.innerHTML = players.map(p=>`
          <div class="waiting-player">
            <div class="wp-tok">${TOKENS[p.token]}</div>
            <div class="wp-name">${p.name}</div>
            ${p.id===myId?'<div class="wp-you">YOU</div>':''}
          </div>`).join('');
        document.getElementById('room-status').textContent = `${players.length}/${data.maxPlayers} players joined`;
        if(isHost&&players.length>=2) document.getElementById('start-game-btn').style.display='';
      }
    } catch(e){
      console.error('listenRoom error:', e);
    }
  });
}

async function hostStartGame(){
  if(!isHost) return;
  try {
    const chArr = Array.from({length:CHANCE_CARDS.length},(_,i)=>i);
    const cmArr = Array.from({length:COMMUNITY.length},(_,i)=>i);
    shuffle(chArr); 
    shuffle(cmArr);
    await dbRef.update({status:'playing', chanceOrder:chArr, communityOrder:cmArr,
      chanceIdx:0, communityIdx:0, pendingBuy:null});
  } catch(e){
    toast('Error starting game: ' + e.message, 'bad');
  }
}

function leaveRoom(){ 
  if(dbRef) dbRef.off(); 
  location.reload(); 
}

function cellGridPos(idx){
  if(idx===0)  return {col:11,row:11,dir:'corner'};
  if(idx===10) return {col:1, row:11,dir:'corner'};
  if(idx===20) return {col:1, row:1, dir:'corner'};
  if(idx===30) return {col:11,row:1, dir:'corner'};
  if(idx>=1 &&idx<=9)  return {col:11-idx,   row:11,          dir:'bottom'};
  if(idx>=11&&idx<=19) return {col:1,         row:11-(idx-10), dir:'left'};
  if(idx>=21&&idx<=29) return {col:idx-20,    row:1,           dir:'top'};
  if(idx>=31&&idx<=39) return {col:11,        row:idx-29,      dir:'right'};
}

function buildBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  const center = document.createElement('div');
  center.className = 'board-center';
  center.style.cssText = 'grid-column:2/11;grid-row:2/11;';
  center.innerHTML = `
    <div class="board-title">MONOPOLY</div>
    <div class="board-sub">Online Multiplayer</div>
    <div class="dice-area">
      <div class="die3d" id="die1"><div class="die3d-inner"><div class="die-face" id="df1">${diceDots(1)}</div></div></div>
      <div class="die3d" id="die2"><div class="die3d-inner"><div class="die-face" id="df2">${diceDots(1)}</div></div></div>
    </div>`;
  board.appendChild(center);
  SQUARES.forEach((sq,idx)=>{
    const pos = cellGridPos(idx);
    const cell = document.createElement('div');
    cell.className = `cell ${pos.dir}`;
    cell.id = `cell-${idx}`;
    cell.style.gridColumn = pos.col;
    cell.style.gridRow = pos.row;
    cell.onclick = ()=>showSqInfo(idx);
    cell.innerHTML = buildCellHTML(sq,idx,pos.dir);
    board.appendChild(cell);
  });
}

function buildCellHTML(sq,idx,dir){
  if(dir==='corner'){
    const lbl = {0:'GO\n🏁',10:'JAIL\n🏛️\nVisiting',20:'FREE\nPARKING\n🅿️',30:'GO TO\nJAIL\n👮'};
    return `<div class="corner-lbl">${lbl[idx]||sq.name}</div>`;
  }
  const isV = dir==='left'||dir==='right';
  const rot = isV?'transform:rotate(90deg);':'';
  let cbar='';
  if(sq.color&&CMAP[sq.color]){
    const s=`background:${CMAP[sq.color]};position:absolute;`;
    if(dir==='bottom') cbar=`<div class="cbar" style="${s}bottom:0;top:auto;left:0;right:0;height:11px;"></div>`;
    else if(dir==='top') cbar=`<div class="cbar" style="${s}top:0;left:0;right:0;height:11px;"></div>`;
    else if(dir==='left') cbar=`<div class="cbar" style="${s}right:0;left:auto;top:0;bottom:0;width:11px;height:auto;"></div>`;
    else if(dir==='right') cbar=`<div class="cbar" style="${s}left:0;right:auto;top:0;bottom:0;width:11px;height:auto;"></div>`;
  }
  const icon = sq.icon?`<div class="cicon" style="${rot}">${sq.icon}</div>`:'';
  const price = sq.price?`<div class="cprice" style="${rot}">$${sq.price}</div>`:sq.amount?`<div class="cprice" style="${rot}">$${sq.amount}</div>`:'';
  return `${cbar}${icon}<div class="cname" style="${rot}">${sq.name}</div>${price}<div id="h-${idx}"></div>`;
}

// ══════════════════════════════════════════════════════════
//  DICE
// ══════════════════════════════════════════════════════════
function diceDots(n){
  const PATS={
    1:[[1,1]], 2:[[0,0],[2,2]], 3:[[0,0],[1,1],[2,2]],
    4:[[0,0],[2,0],[0,2],[2,2]], 5:[[0,0],[2,0],[1,1],[0,2],[2,2]],
    6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]
  };
  const dots = PATS[n]||PATS[1];
  let h='';
  for(let r=0;r<3;r++) for(let c=0;c<3;c++){
    const f = dots.some(([dc,dr])=>dc===c&&dr===r);
    h+=`<div class="dot${f?' on':''}"></div>`;
  }
  return h;
}

function animateDice(d1,d2){
  return new Promise(res=>{
    let frames=0;
    const interval=setInterval(()=>{
      document.getElementById('df1').innerHTML=diceDots((frames%6)+1);
      document.getElementById('df2').innerHTML=diceDots(((frames+3)%6)+1);
      frames++;
      if(frames>10){
        clearInterval(interval);
        document.getElementById('df1').innerHTML=diceDots(d1);
        document.getElementById('df2').innerHTML=diceDots(d2);
        const de1=document.getElementById('die1');
        const de2=document.getElementById('die2');
        de1.classList.add('rolling'); de2.classList.add('rolling');
        setTimeout(()=>{ de1.classList.remove('rolling'); de2.classList.remove('rolling'); res(); },620);
      }
    },55);
  });
}

// ══════════════════════════════════════════════════════════
//  TOKEN MOVEMENT
// ══════════════════════════════════════════════════════════
function getCellCenter(idx){
  const el = document.getElementById(`cell-${idx}`);
  const board = document.getElementById('board');
  if(!el||!board) return null;
  const br = board.getBoundingClientRect();
  const cr = el.getBoundingClientRect();
  return {x:cr.left-br.left+cr.width/2, y:cr.top-br.top+cr.height/2};
}

function ensureTokenEls(){
  const layer = document.getElementById('tok-layer');
  const board = document.getElementById('board');
  layer.style.width = board.offsetWidth+'px';
  layer.style.height = board.offsetHeight+'px';
  
  const players = getPlayers();
  players.forEach(p=>{
    if(!p) return;
    let el = document.getElementById('tok-'+p.id);
    if(!el){
      el = document.createElement('div');
      el.id = 'tok-'+p.id; 
      el.className='ptoken';
      el.style.background = p.color; 
      el.textContent = TOKENS[p.token];
      el.style.opacity = '0';
      layer.appendChild(el);
    }
  });
}

function placeTokensInstant(){
  ensureTokenEls();
  const players = getPlayers();
  if(!players.length) return;
  
  const groups={};
  players.forEach(p=>{
    if(!p || p.bankrupt) return;
    if(!groups[p.pos]) groups[p.pos]=[];
    groups[p.pos].push(p);
  });
  
  players.forEach(p=>{
    if(!p) return;
    const el = document.getElementById('tok-'+p.id);
    if(!el) return;
    if(p.bankrupt){ el.style.opacity='0'; return; }
    
    const grp = groups[p.pos]||[p];
    const i = grp.findIndex(x=>x && x.id===p.id);
    const c = getCellCenter(p.pos);
    if(!c) return;
    
    const ox = (i%2)*14-(grp.length>1?7:0);
    const oy = Math.floor(i/2)*14-(grp.length>2?7:0);
    el.style.left = (c.x-11+ox)+'px';
    el.style.top  = (c.y-11+oy)+'px';
    el.style.opacity = '1';
    el.classList.toggle('active-glow', p.id===G.current && !p.bankrupt);
  });
}

async function animatePlayerMove(pid, fromPos, toPos){
  localMoving = true;
  const el = document.getElementById('tok-'+pid);
  if(!el){ localMoving=false; return; }
  
  el.classList.add('moving');
  let cur = fromPos;
  const steps = ((toPos-fromPos+40)%40)||40;
  
  for(let s=0;s<steps;s++){
    cur = (cur+1)%40;
    const c = getCellCenter(cur);
    if(c){ el.style.left=(c.x-11)+'px'; el.style.top=(c.y-11)+'px'; }
    await delay(160);
  }
  
  el.classList.remove('moving');
  localMoving = false;
  placeTokensInstant();
}

function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

function renderAll(){

}

function positionTokens(){
  ensureTokenEls();
  const players = getPlayers();
  if(!players.length) return;
  
  players.forEach(p=>{
    if(!p) return;
    if(lastPositions[p.id]!==undefined && lastPositions[p.id]!==p.pos && !p.bankrupt && !localMoving){
      const from = lastPositions[p.id];
      lastPositions[p.id] = p.pos;
      animatePlayerMove(p.id, from, p.pos);
    } else {
      lastPositions[p.id] = p.pos;
    }
  });
  placeTokensInstant();
}

//  CONTROLS
// ══════════════════════════════════════════════════════════
function isMyTurn(){ 
  return G && G.current===myId; 
}

function updateControls(){
  const players = getPlayers();
  if(!players.length) return;
  
  const me = getPlayer(myId);
  if(!me) return;
  
  const myTurn = isMyTurn() && !me.bankrupt;
  const notDiv = document.getElementById('not-your-turn');
  const cur = getPlayer(G.current);
  
  if(!myTurn){
    notDiv.style.display='';
    document.getElementById('whose-turn-name').textContent = cur?cur.name:'…';
  } else {
    notDiv.style.display='none';
  }

  document.getElementById('roll-btn').disabled = !myTurn || G.rolled;
  document.getElementById('end-btn').disabled = !myTurn || !G.rolled || !!G.pendingBuy;

  const hasPending = G.pendingBuy && G.pendingBuy.playerId===myId;
  document.getElementById('buy-btn').disabled = !hasPending;

  const props = getProps();
  document.getElementById('mort-btn').disabled = !(props.some(p=>p && p.owner===myId));

  const colors = ['brown','lightblue','magenta','orange','red','yellow','green','darkblue'];
  const hasBuild = myTurn && props.length && colors.some(color=>{
    const cp = props.filter(p=>p && SQUARES[p.sqIdx].color===color);
    return cp.length>0 && cp.every(p=>p && p.owner===myId);
  });
  document.getElementById('build-btn').disabled = !hasBuild;

  const jailDiv = document.getElementById('jail-actions');
  if(myTurn && me.inJail){
    let html='';
    if(me.money>=50) html+=`<button class="btn btn-y btn-sm" onclick="payJail()">Pay $50 Bail</button>`;
    if(me.jailCard) html+=`<button class="btn btn-g btn-sm" onclick="useJailCard()">Use Jail Card</button>`;
    jailDiv.innerHTML = html;
    jailDiv.style.display = html?'flex':'none';
  } else {
    jailDiv.style.display = 'none';
  }

  const turnInfo = document.getElementById('turn-info');
  if(myTurn){
    if(me.inJail){
      turnInfo.textContent = `You're in jail! Roll doubles to escape, pay $50, or use a Jail card.`;
    } else if(G.pendingBuy){
      turnInfo.textContent = 'Decide: buy or auction the property.';
    } else if(!G.rolled){
      turnInfo.textContent = 'Roll the dice!';
    } else if(G.diceVals[0]===G.diceVals[1]){
      turnInfo.textContent = `Doubles! Roll again after actions.`;
    } else {
      turnInfo.textContent = 'Take action or end your turn.';
    }
  } else {
    turnInfo.textContent = '';
  }
}

// ══════════════════════════════════════════════════════════
async function writeState(){
  if(!dbRef||!G) return;
  try {
    await dbRef.set(G);
  } catch(e){
    console.error('writeState error:', e);
    toast('Sync error: ' + e.message, 'bad');
  }
}

// ── ROLL DICE ──
async function rollDice(){
  if(!isMyTurn() || G.rolled) return;
  if(G.pendingBuy){ toast('Resolve the property purchase first!','bad'); return; }

  processingAction = true;
  const p = getPlayer(myId);
  if(!p){ processingAction=false; return; }
  
  const d1 = rollDie();
  const d2 = rollDie();
  const sum = d1+d2;
  const isDoubles = d1===d2;
  
  G.diceVals = [d1,d2];
  await animateDice(d1,d2);

  if(p.inJail){
    if(isDoubles){
      p.inJail = false; 
      p.jailTurns = 0;
      G.doubles = 0;
      log(`${p.name} rolled doubles (${d1}+${d2}) — escaped jail!`,'good');
      toast('Escaped jail with doubles!','good');
      G.rolled = true;
      await doMove(p, sum);
    } else {
      p.jailTurns = (p.jailTurns||0)+1;
      if(p.jailTurns>=3){
        p.inJail = false; 
        p.jailTurns = 0; 
        p.money -= 50;
        log(`${p.name} paid $50 bail (3 failed attempts) and rolled ${d1}+${d2}`,'bad');
        toast('Paid $50 bail after 3 turns','bad');
        G.rolled = true;
        await doMove(p, sum);
      } else {
        log(`${p.name} stays in jail (attempt ${p.jailTurns}/3)`,'bad');
        G.rolled = true;
      }
    }
  } else {
    if(isDoubles){
      G.doubles = (G.doubles||0)+1;
      if(G.doubles>=3){
        log(`${p.name} rolled 3 doubles in a row — Jail!`,'bad');
        toast('3 doubles in a row — Jail!','bad');
        toJail(p);
        G.rolled = true; 
        G.doubles = 0;
        await writeState();
        processingAction = false;
        renderAll(); 
        updateControls();
        return;
      }
      log(`${p.name} rolled doubles (${d1}+${d2})! Rolls again after turn.`,'good');
    } else {
      G.doubles = 0;
    }
    G.rolled = true;
    await doMove(p, sum);
  }

  await writeState();
  processingAction = false;
  renderAll(); 
  updateControls();
}

// ── MOVE PLAYER ──
async function doMove(p, steps){
  const old = p.pos;
  const newPos = (p.pos+steps)%40;

  if(newPos < old || (old===0 && steps>0)){
    p.money += 200;
    log(`${p.name} passed GO! +$200`,'good');
    toast(`${p.name} passed GO! +$200`,'good');
  }
  p.pos = newPos;
  log(`${p.name} rolls ${G.diceVals[0]}+${G.diceVals[1]}=${G.diceVals[0]+G.diceVals[1]} → ${SQUARES[p.pos].name}`);
  await animatePlayerMove(p.id, old, p.pos);
  await delay(200);
  await landOn(p);
}

// ── LAND ON SQUARE ──
async function landOn(p){
  const sq = SQUARES[p.pos];
  switch(sq.type){
    case 'property':
    case 'railroad':
    case 'utility':
      await handlePropLand(p, sq);
      break;
    case 'tax':
      p.money -= sq.amount;
      G.freeParking = (G.freeParking||0) + sq.amount;
      log(`${p.name} paid $${sq.amount} tax`,'bad');
      toast(`Paid $${sq.amount} tax`,'bad');
      await checkBankruptcy(p);
      break;
    case 'chance':
      await doCard('chance', p);
      break;
    case 'community':
      await doCard('community', p);
      break;
    case 'gotojail':
      toJail(p);
      log(`${p.name} is sent to jail!`,'bad');
      toast(`${p.name} goes to jail!`,'bad');
      break;
    case 'freeparking':
      if((G.freeParking||0)>0){
        p.money += G.freeParking;
        log(`${p.name} collects $${G.freeParking} Free Parking!`,'good');
        toast(`Free Parking! +$${G.freeParking}`,'good');
        G.freeParking = 0;
      } else {
        log(`${p.name} lands on Free Parking`);
      }
      break;
    case 'jail':
      log(`${p.name} is Just Visiting`);
      break;
    case 'go':
      log(`${p.name} is on GO`);
      break;
  }
}

// ── PROPERTY LANDING ──
async function handlePropLand(p, sq){
  const props = getProps();
  const pr = props.find(x=>x && SQUARES[x.sqIdx].name===sq.name);
  if(!pr) return;

  if(pr.owner===null){
    G.pendingBuy = {sqIdx: pr.sqIdx, playerId: p.id};
    log(`${p.name} landed on unowned ${sq.name}`);
  } else if(pr.owner===p.id){
    log(`${p.name} owns ${sq.name}`);
  } else if(!pr.mortgaged){
    const owner = getPlayer(pr.owner);
    if(!owner) return;
    const rent = calcRent(pr, sq);
    p.money -= rent; 
    owner.money += rent;
    log(`${p.name} paid $${rent} rent to ${owner.name}`,'bad');
    toast(`Paid $${rent} rent to ${owner.name}`,'bad');
    await checkBankruptcy(p);
  } else {
    log(`${p.name} on mortgaged ${sq.name} — no rent`);
  }
}

// ── BUY MODAL ──
function showBuyModalFromPending(){
  if(!G.pendingBuy) return;
  const {sqIdx, playerId} = G.pendingBuy;
  if(playerId !== myId) return;
  
  const sq = SQUARES[sqIdx];
  const props = getProps();
  const pr = props.find(x=>x && x.sqIdx===sqIdx);
  if(!pr || pr.owner!==null){
    clearPendingBuy(); 
    return;
  }
  
  const p = getPlayer(myId);
  if(!p) return;
  
  const colorBar = sq.color?`<div class="color-bar-m" style="background:${CMAP[sq.color]}"></div>`:'';
  const rentRows = sq.rent?sq.rent.map((r,i)=>`<tr><td>${['Base','1 House','2 Houses','3 Houses','4 Houses','Hotel'][i]}</td><td>$${r}</td></tr>`).join(''):'';
  const rrRows = sq.type==='railroad'?`<tr><td>1 RR</td><td>$25</td></tr><tr><td>2 RR</td><td>$50</td></tr><tr><td>3 RR</td><td>$100</td></tr><tr><td>4 RR</td><td>$200</td></tr>`:'';
  
  modal(`🏠 ${sq.name}`,`
    ${colorBar}
    <p><strong>${p.name}</strong> landed here.</p>
    <p>Price: <strong style="color:var(--gold)">$${sq.price}</strong> &nbsp; Balance: <strong style="color:var(--green)">$${p.money}</strong></p>
    <table class="rent-t">${rentRows}${rrRows}</table>
  `,[
    {l:`Buy $${sq.price}`, c:'btn-g', fn: async()=>{
      const buyer = getPlayer(myId);
      if(!buyer || buyer.money < sq.price){ toast("Not enough money!",'bad'); return; }
      buyer.money -= sq.price;
      pr.owner = myId;
      G.pendingBuy = null;
      log(`${buyer.name} bought ${sq.name}`,'good');
      toast(`Bought ${sq.name}!`,'good');
      closeModal();
      await writeState();
      renderAll(); 
      updateControls();
    }},
    {l:'Auction', c:'btn-y', fn:()=>{
      G.pendingBuy = null;
      closeModal();
      startAuction(sq, pr);
    }},
    {l:'Pass (Auction)', c:'btn-r', fn:()=>{
      G.pendingBuy = null;
      closeModal();
      startAuction(sq, pr);
    }},
  ]);
}

async function buyPropertyDirect(){
  if(!G.pendingBuy || G.pendingBuy.playerId!==myId) return;
  showBuyModalFromPending();
}

async function clearPendingBuy(){
  G.pendingBuy = null;
  await writeState();
}

// ── AUCTION ──
function startAuction(sq, pr){
  let bidderIdx = 0, hi = 0, hiBidder = null;
  const bidders = getPlayers().filter(p=>p && !p.bankrupt);
  
  function nextBidder(){
    if(bidderIdx>=bidders.length){
      if(hiBidder!==null){
        const w = getPlayer(hiBidder);
        if(w){
          w.money -= hi; 
          pr.owner = hiBidder;
          log(`${w.name} won auction for ${sq.name} at $${hi}`,'good');
          toast(`${w.name} wins ${sq.name}!`,'good');
        }
      } else {
        log(`${sq.name} auction — no bids, remains with bank`);
      }
      writeState(); 
      renderAll(); 
      updateControls();
      return;
    }
    
    const p = bidders[bidderIdx];
    if(!p){ bidderIdx++; nextBidder(); return; }
    
    const minBid = hi+1;
    modal(`Auction: ${sq.name}`,`
      <p>High bid: <strong style="color:var(--gold)">$${hi}</strong>${hiBidder!==null?' by '+getPlayer(hiBidder).name:' (none)'}</p>
      <p>${p.name}'s turn — Balance: $${p.money} — Min bid: $${minBid}</p>
      <input type="number" id="bid-in" min="${minBid}" max="${p.money}" value="${Math.min(minBid,p.money)}"
        style="width:100%;padding:10px;margin-top:8px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;
        background:rgba(255,255,255,0.08);color:white;font-size:18px;font-family:'Barlow Condensed'">
    `,[
      {l:'Bid', c:'btn-g', fn:()=>{
        const amt=parseInt(document.getElementById('bid-in').value)||0;
        if(amt>=minBid && amt<=p.money){ hi=amt; hiBidder=p.id; }
        bidderIdx++; 
        nextBidder();
      }},
      {l:'Pass', c:'btn-r', fn:()=>{ bidderIdx++; nextBidder(); }},
    ]);
  }
  nextBidder();
}

// ── CHANCE / COMMUNITY ──
async function doCard(type, p){
  const isChance = type==='chance';
  const arr = isChance?CHANCE_CARDS:COMMUNITY;
  const order = isChance?(G.chanceOrder||[]):(G.communityOrder||[]);
  const idx = isChance?(G.chanceIdx||0):(G.communityIdx||0);
  const cardIdx = order[idx%order.length];
  const card = arr[cardIdx!==undefined?cardIdx:0] || arr[0];
  
  if(isChance) G.chanceIdx=(idx+1); else G.communityIdx=(idx+1);

  await new Promise(res=>{
    modal(
      isChance?'Chance ❓':'Community Chest 📦',
      `<p style="font-size:16px;font-style:italic;color:var(--gold)">"${card.t}"</p>`,
      [{l:'OK', c:'btn-p', fn:async()=>{
        closeModal();
        await card.a(p,G);
        res();
      }}]
    );
  });
  
  renderAll(); 
  updateControls();
}

// ── JAIL ──
function toJail(p){
  p.pos = 10; 
  p.inJail = true; 
  p.jailTurns = 0;
}

async function teleportTo(p, target, G2, checkGo=true){
  const old = p.pos;
  if(checkGo && target<old){ p.money+=200; log(`${p.name} passed GO! +$200`,'good'); }
  p.pos = target;
  await animatePlayerMove(p.id, old, target);
  await delay(200);
  await landOn(p);
  renderAll(); 
  updateControls();
}

// ── BANKRUPTCY ──
async function checkBankruptcy(p){
  if(p.money>=0) return;
  if(p.id===myId){
    await new Promise(res=>{
      modal(`💸 Bankruptcy Warning`,`
        <p style="color:var(--red)">You're in debt! Balance: <strong>$${p.money}</strong></p>
        <p>Use Mortgage or Sell Buildings to raise funds, then end your turn.<br>
        If still in debt when you end your turn, you'll go bankrupt.</p>
      `,[
        {l:'Manage Assets', c:'btn-y', fn:()=>{ closeModal(); res(); }},
        {l:'Declare Bankrupt', c:'btn-r', fn:()=>{ closeModal(); declareBankrupt(p); res(); }},
      ]);
    });
  } else {
    if(p.money<0) declareBankrupt(p);
  }
}

function declareBankrupt(p){
  if(p.bankrupt) return;
  p.bankrupt = true;
  const props = getProps();
  props.forEach(pr=>{ 
    if(pr && pr.owner===p.id){ 
      pr.owner=null; 
      pr.mortgaged=false; 
      pr.houses=0; 
      pr.hotel=false; 
    }
  });
  log(`${p.name} went BANKRUPT! 💀`,'bad');
  toast(`${p.name} bankrupt!`,'bad');
  const alive = getPlayers().filter(x=>x && !x.bankrupt);
  if(alive.length===1) showWinner(alive[0]);
}

function showWinner(p){
  if(!p) return;
  document.getElementById('win').classList.add('on');
  document.getElementById('win-name').textContent = `${TOKENS[p.token]} ${p.name}`;

// ── END TURN ──
async function endTurn(){
  if(!isMyTurn() || !G.rolled) return;
  if(G.pendingBuy){ toast('Resolve the property purchase first!','bad'); return; }

  const me = getPlayer(myId);
  if(!me) return;
  
  if(me.money<0){ 
    await checkBankruptcy(me); 
    if(me.bankrupt){ 
      await writeState(); 
      return; 
    } 
  }

  const rolledDoubles = G.diceVals[0]===G.diceVals[1];

  if(rolledDoubles && !me.inJail && G.doubles > 0 && G.doubles < 3){
    G.rolled = false;
    log(`${me.name} gets another roll for doubles!`,'good');
    await writeState();
    renderAll(); 
    updateControls();
    return;
  }

  const players = getPlayers();
  let next = (G.current+1) % players.length;
  while(players[next] && players[next].bankrupt) next = (next+1) % players.length;
  
  G.current = next;
  G.rolled = false;
  G.doubles = 0;
  G.pendingBuy = null;
  
  const nextPlayer = getPlayer(next);
  if(nextPlayer) log(`--- ${nextPlayer.name}'s turn ---`,'imp');
  
  await writeState();
  renderAll(); 
  updateControls();
}

function calcRent(pr, sq){
  if(sq.type==='utility'){
    const props = getProps();
    const n = props.filter(p=>p && SQUARES[p.sqIdx].type==='utility'&&p.owner===pr.owner).length;
    return (G.diceVals[0]+G.diceVals[1]) * (n===2?10:4);
  }
  if(sq.type==='railroad'){
    const props = getProps();
    const n = props.filter(p=>p && SQUARES[p.sqIdx].type==='railroad'&&p.owner===pr.owner).length;
    return [25,50,100,200][n-1]||25;
  }
  if(pr.hotel) return sq.rent[5];
  if(pr.houses>0) return sq.rent[pr.houses];
  
  const props = getProps();
  const grp = props.filter(p=>p && SQUARES[p.sqIdx].color===sq.color);
  const monopoly = grp.length>0 && grp.every(p=>p && p.owner===pr.owner);
  return monopoly ? sq.rent[0]*2 : sq.rent[0];
}

function openMortgage(){
  const p = getPlayer(myId);
  const props = getProps();
  const owned = props.filter(pr=>pr && pr.owner===myId);
  
  if(!owned.length){ toast('No properties!','bad'); return; }
  
  const rows = owned.map(pr=>{
    if(!pr) return '';
    const sq = SQUARES[pr.sqIdx];
    const hasBuildings = pr.houses>0||pr.hotel;
    return `<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
      <div style="width:10px;height:10px;border-radius:50%;background:${CMAP[sq.color]||'#888'};flex-shrink:0"></div>
      <span style="flex:1;font-size:13px;color:rgba(255,255,255,0.8)">${sq.name}${pr.mortgaged?' (M)':''}${hasBuildings?' 🏗':''}</span>
      <button class="btn btn-sm ${pr.mortgaged?'btn-g':'btn-r'}" onclick="toggleMort(${pr.sqIdx})">
        ${pr.mortgaged?`Unmortgage $${sq.mg*2}`:`Mortgage $${sq.mg}`}
      </button>
    </div>`;
  }).join('');
  
  modal('📋 Mortgage / Unmortgage', rows, [{l:'Close',c:'btn-p',fn:closeModal}]);
}

async function toggleMort(sqIdx){
  const p = getPlayer(myId);
  if(!p) return;
  
  const props = getProps();
  const pr = props.find(x=>x && x.sqIdx===sqIdx);
  const sq = SQUARES[sqIdx];
  
  if(!pr||pr.owner!==myId) return;
  
  if(pr.mortgaged){
    const cost = Math.floor(sq.mg*1.1);
    if(p.money>=cost){ 
      p.money-=cost; 
      pr.mortgaged=false; 
      log(`${p.name} unmortgaged ${sq.name} for $${cost}`,'good'); 
    }
    else{ 
      toast('Not enough money!','bad'); 
      return; 
    }
  } else {
    if(pr.houses>0||pr.hotel){ 
      toast('Sell buildings first!','bad'); 
      return; 
    }
    p.money += sq.mg; 
    pr.mortgaged=true;
    log(`${p.name} mortgaged ${sq.name} for $${sq.mg}`);
  }
  closeModal(); 
  await writeState(); 
  openMortgage();
}

function openBuild(){
  const colors = ['brown','lightblue','magenta','orange','red','yellow','green','darkblue'];
  let rows='';
  const props = getProps();
  
  colors.forEach(color=>{
    const cp = props.filter(pr=>pr && SQUARES[pr.sqIdx].color===color);
    if(!cp.length||!cp.every(pr=>pr && pr.owner===myId)) return;
    if(cp.some(pr=>pr && pr.mortgaged)){
      rows+=`<p style="color:var(--red);font-size:12px;text-transform:capitalize">Unmortgage all ${color} before building.</p>`;
      return;
    }
    cp.forEach(pr=>{
      if(!pr) return;
      const sq = SQUARES[pr.sqIdx];
      rows+=`<div style="display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
        <div style="width:10px;height:10px;border-radius:50%;background:${CMAP[color]};flex-shrink:0"></div>
        <span style="flex:1;font-size:12px;color:rgba(255,255,255,0.8)">${sq.name} ${'🏠'.repeat(pr.houses)}${pr.hotel?'🏨':''}</span>
        <button class="btn btn-g btn-sm" onclick="doBuild(${pr.sqIdx})">+$${sq.hc}</button>
        <button class="btn btn-r btn-sm" onclick="doSell(${pr.sqIdx})">Sell $${Math.floor(sq.hc/2)}</button>
      </div>`;
    });
  });
  
  if(!rows) rows='<p style="color:rgba(255,255,255,0.5)">You need a full color set to build.</p>';
  modal('🏗 Build / Sell Houses', rows, [{l:'Close',c:'btn-p',fn:closeModal}]);
}

async function doBuild(sqIdx){
  const p = getPlayer(myId);
  const props = getProps();
  const pr = props.find(x=>x && x.sqIdx===sqIdx);
  const sq = SQUARES[sqIdx];
  
  if(!pr||!p||pr.owner!==myId) return;
  if(pr.hotel){ toast('Already has a hotel!','bad'); return; }
  if(p.money<sq.hc){ toast('Not enough money!','bad'); return; }
  
  const grp = props.filter(x=>x && SQUARES[x.sqIdx].color===sq.color);
  const thisCount = pr.houses+(pr.hotel?5:0);
  const minCount = Math.min(...grp.map(x=>x?x.houses+(x.hotel?5:0):0));
  
  if(thisCount>minCount){ toast('Build evenly — add to the least-developed property first.','bad'); return; }
  
  p.money -= sq.hc;
  if(pr.houses===4){ 
    pr.houses=0; 
    pr.hotel=true; 
    log(`${p.name} built 🏨 hotel on ${sq.name}`,'good'); 
  } else { 
    pr.houses++; 
    log(`${p.name} built 🏠 on ${sq.name}`,'good'); 
  }
  
  closeModal(); 
  await writeState(); 
  openBuild();
}

async function doSell(sqIdx){
  const p = getPlayer(myId);
  const props = getProps();
  const pr = props.find(x=>x && x.sqIdx===sqIdx);
  const sq = SQUARES[sqIdx];
  
  if(!pr||!p||pr.owner!==myId) return;
  
  const grp = props.filter(x=>x && SQUARES[x.sqIdx].color===sq.color);
  const thisCount = pr.houses+(pr.hotel?5:0);
  const maxCount = Math.max(...grp.map(x=>x?x.houses+(x.hotel?5:0):0));
  
  if(thisCount<maxCount){ toast('Sell evenly — sell from the most-developed property first.','bad'); return; }
  
  if(pr.hotel){ 
    pr.hotel=false; 
    pr.houses=4; 
    p.money+=Math.floor(sq.hc/2); 
    log(`${p.name} sold hotel on ${sq.name}`); 
  } else if(pr.houses>0){ 
    pr.houses--; 
    p.money+=Math.floor(sq.hc/2); 
    log(`${p.name} sold house on ${sq.name}`); 
  } else { 
    toast('No buildings to sell!','bad'); 
    return; 
  }
  
  closeModal(); 
  await writeState(); 
  openBuild();
}

function openTrade(){
  const others = getPlayers().filter(p=>p && !p.bankrupt&&p.id!==myId);
  if(!others.length){ toast('No one to trade with','bad'); return; }
  
  const me = getPlayer(myId);
  const props = getProps();
  const myProps = props.filter(pr=>pr && pr.owner===myId);
  const tid0 = others[0].id;
  const theirProps = props.filter(pr=>pr && pr.owner===tid0);
  
  modal('🤝 Trade',`
    <div class="trow"><label>With</label>
      <select class="trade-sel" id="t-target" onchange="updateTradeProps()">
        ${others.map(p=>`<option value="${p.id}">${TOKENS[p.token]} ${p.name}</option>`).join('')}
      </select>
    </div>
    <div class="tcols">
      <div class="tcol">
        <div class="tcol-hd" style="color:var(--green)">You Offer</div>
        <div class="trow"><label>Cash</label><input type="number" id="t-oc" min="0" max="${me?me.money:0}" value="0"></div>
        <div class="tcl" id="t-op">
          ${myProps.map(pr=>pr?`<label class="tcheck"><input type="checkbox" data-side="o" data-si="${pr.sqIdx}"><span>${SQUARES[pr.sqIdx].name}</span></label>`:'').join('')||'<span style="color:rgba(255,255,255,0.3)">None</span>'}
        </div>
      </div>
      <div class="tcol">
        <div class="tcol-hd" style="color:var(--accent)">They Offer</div>
        <div class="trow"><label>Cash</label><input type="number" id="t-rc" min="0" value="0"></div>
        <div class="tcl" id="t-rp">
          ${theirProps.map(pr=>pr?`<label class="tcheck"><input type="checkbox" data-side="r" data-si="${pr.sqIdx}"><span>${SQUARES[pr.sqIdx].name}</span></label>`:'').join('')||'<span style="color:rgba(255,255,255,0.3)">None</span>'}
        </div>
      </div>
    </div>
  `,[
    {l:'Propose Trade', c:'btn-g', fn:async()=>{
      const tid = parseInt(document.getElementById('t-target').value);
      const oc = parseInt(document.getElementById('t-oc').value)||0;
      const rc = parseInt(document.getElementById('t-rc').value)||0;
      const op = [...document.querySelectorAll('[data-side="o"]:checked')].map(x=>parseInt(x.dataset.si));
      const rp = [...document.querySelectorAll('[data-side="r"]:checked')].map(x=>parseInt(x.dataset.si));
      
      const target = getPlayer(tid);
      const trader = getPlayer(myId);
      if(!target||!trader) return;
      
      if(oc>trader.money){ toast("You don't have $"+oc,'bad'); return; }
      if(rc>target.money){ toast(`${target.name} doesn't have $${rc}`,'bad'); return; }
      
      trader.money -= oc; 
      target.money += oc;
      trader.money += rc; 
      target.money -= rc;
      
      const propsArr = getProps();
      op.forEach(si=>{ 
        const pr=propsArr.find(x=>x && x.sqIdx===si); 
        if(pr){ pr.owner=tid; pr.houses=0; pr.hotel=false; }
      });
      rp.forEach(si=>{ 
        const pr=propsArr.find(x=>x && x.sqIdx===si); 
        if(pr){ pr.owner=myId; pr.houses=0; pr.hotel=false; }
      });
      
      log(`Trade: ${trader.name} ↔ ${target.name}`,'imp');
      toast('Trade complete!','good');
      closeModal(); 
      await writeState();
    }},
    {l:'Cancel', c:'btn-r', fn:closeModal},
  ]);
}

window.updateTradeProps = function(){
  const tid = parseInt(document.getElementById('t-target').value);
  const props = getProps();
  const rp = document.getElementById('t-rp');
  if(rp) rp.innerHTML = props.filter(pr=>pr && pr.owner===tid)
    .map(pr=>pr?`<label class="tcheck"><input type="checkbox" data-side="r" data-si="${pr.sqIdx}"><span>${SQUARES[pr.sqIdx].name}</span></label>`:'')
    .join('') || '<span style="color:rgba(255,255,255,0.3)">None</span>';
};

async function payJail(){
  const p = getPlayer(myId);
  if(!p||!p.inJail) return;
  if(p.money<50){ toast('Not enough money!','bad'); return; }
  
  p.money -= 50; 
  p.inJail = false; 
  p.jailTurns = 0;
  log(`${p.name} paid $50 bail`,'bad');
  toast('Paid $50 bail — now roll!','good');
  await writeState();
  renderAll(); 
  updateControls();
}

async function useJailCard(){
  const p = getPlayer(myId);
  if(!p||!p.inJail||!p.jailCard) return;
  
  p.jailCard = false; 
  p.inJail = false; 
  p.jailTurns = 0;
  log(`${p.name} used Get Out of Jail Free card`,'good');
  toast('Used Jail Free card — now roll!','good');
  await writeState();
  renderAll(); 
  updateControls();
}

function showSqInfo(idx){
  const sq = SQUARES[idx];
  const props = getProps();
  const pr = props.find(x=>x && x.sqIdx===idx);
  const owner = pr&&pr.owner!==null&&getPlayer(pr.owner);
  
  const colorBar = sq.color?`<div class="color-bar-m" style="background:${CMAP[sq.color]}"></div>`:'';
  let body = `${colorBar}<p><strong style="font-size:16px">${sq.name}</strong></p>`;
  
  if(pr){
    body += `<p>Owner: <strong style="color:var(--gold)">${owner?TOKENS[owner.token]+' '+owner.name:'Bank'}</strong></p>`;
    if(pr.mortgaged) body+=`<p style="color:var(--red)">🔴 Mortgaged</p>`;
    if(pr.houses) body+=`<p>${'🏠'.repeat(pr.houses)}</p>`;
    if(pr.hotel) body+=`<p>🏨 Hotel</p>`;
    if(sq.rent) body+=`<table class="rent-t">${sq.rent.map((r,i)=>`<tr><td>${['Base','1H','2H','3H','4H','Hotel'][i]}</td><td>$${r}</td></tr>`).join('')}</table>`;
    if(sq.type==='railroad') body+=`<p style="font-size:12px;margin-top:6px;color:rgba(255,255,255,0.5)">$25/$50/$100/$200 for 1/2/3/4 railroads</p>`;
    if(sq.type==='utility') body+=`<p style="font-size:12px;margin-top:6px;color:rgba(255,255,255,0.5)">4× dice (1 utility) or 10× dice (both utilities)</p>`;
  }
  
  modal(sq.name, body, [{l:'Close',c:'btn-p',fn:closeModal}]);
}

// ══════════════════════════════════════════════════════════
//  MODAL / TOAST / LOG
// ══════════════════════════════════════════════════════════
function modal(title, body, acts){
  const bg = document.getElementById('modal-bg');
  const mb = document.getElementById('modal-body');
  mb.innerHTML = `<h2>${title}</h2>${body}
    <div class="modal-acts">
      ${acts.map((a,i)=>`<button class="btn ${a.c}" id="ma${i}">${a.l}</button>`).join('')}
    </div>`;
  bg.classList.add('on');
  acts.forEach((a,i)=>document.getElementById('ma'+i).onclick=a.fn);
}

function closeModal(){ 
  document.getElementById('modal-bg').classList.remove('on'); 
}

document.getElementById('modal-bg').onclick = e=>{
  if(e.target===document.getElementById('modal-bg')) closeModal();
};

function toast(msg, type=''){
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast ${type}`; 
  t.textContent = msg;
  c.appendChild(t); 
  setTimeout(()=>t.remove(), 3100);
}

function log(msg, type=''){
  const box = document.getElementById('log');
  const e = document.createElement('div');
  e.className = `le ${type}`; 
  e.textContent = msg;
  box.insertBefore(e, box.firstChild);
  if(box.children.length>80) box.lastChild.remove();
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}
